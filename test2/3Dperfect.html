<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tech Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: radial-gradient(circle at center, #0a0a0a 0%, #000000 100%);
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .tech-interface {
            position: relative;
            width: 500px;
            height: 500px;
            transform-style: preserve-3d;
            perspective: 1000px;
        }
        
        .central-hub {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #00ffff, #0099cc);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 
                0 0 40px rgba(0, 255, 255, 0.6),
                inset 0 0 20px rgba(0, 255, 255, 0.3);
            animation: centralPulse 3s ease-in-out infinite;
            z-index: 10;
            cursor: pointer;
        }
        
        .central-gear {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #ffffff, #cccccc);
            border-radius: 50%;
            position: relative;
            animation: rotateCentral 10s linear infinite;
        }
        
        .central-gear::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: radial-gradient(circle, #666666, #333333);
            border-radius: 50%;
        }
        
        .gear-tooth {
            position: absolute;
            width: 8px;
            height: 16px;
            background: linear-gradient(45deg, #ffffff, #cccccc);
            border-radius: 2px;
        }
        
        .gear-tooth:nth-child(1) { top: -8px; left: calc(50% - 4px); }
        .gear-tooth:nth-child(2) { top: 8px; right: -8px; transform: rotate(90deg); }
        .gear-tooth:nth-child(3) { bottom: -8px; left: calc(50% - 4px); }
        .gear-tooth:nth-child(4) { top: 8px; left: -8px; transform: rotate(90deg); }
        .gear-tooth:nth-child(5) { top: 2px; right: 2px; transform: rotate(45deg); }
        .gear-tooth:nth-child(6) { bottom: 2px; right: 2px; transform: rotate(135deg); }
        .gear-tooth:nth-child(7) { bottom: 2px; left: 2px; transform: rotate(225deg); }
        .gear-tooth:nth-child(8) { top: 2px; left: 2px; transform: rotate(315deg); }
        
        .orbit-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: grab;
            user-select: none;
        }
        
        .orbit-container:active {
            cursor: grabbing;
        }
        
        .orbit-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            transition: transform 0.3s ease;
        }
        
        .orbit-ring-1 {
            width: 280px;
            height: 280px;
        }
        
        .orbit-ring-2 {
            width: 380px;
            height: 380px;
        }
        
        .orbit-icon {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(45deg, rgba(0, 255, 255, 0.8), rgba(0, 153, 204, 0.8));
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            color: white;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            animation: iconFloat 3s ease-in-out infinite;
            flex-direction: column;
            font-weight: bold;
            text-align: center;
        }
        
        .orbit-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
            background: linear-gradient(45deg, rgba(0, 255, 255, 1), rgba(0, 153, 204, 1));
        }
        
        .orbit-icon.active {
            background: linear-gradient(45deg, rgba(255, 255, 255, 0.9), rgba(0, 255, 255, 0.9));
            color: #000;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.8);
        }
        
        .icon-symbol {
            font-size: 20px;
            margin-bottom: 2px;
        }
        
        .icon-label {
            font-size: 8px;
            font-weight: normal;
        }
        
        .orbit-icon-1 { top: -30px; left: calc(50% - 30px); animation-delay: 0s; }
        .orbit-icon-2 { top: calc(50% - 30px); right: -30px; animation-delay: 0.5s; }
        .orbit-icon-3 { bottom: -30px; left: calc(50% - 30px); animation-delay: 1s; }
        .orbit-icon-4 { top: calc(50% - 30px); left: -30px; animation-delay: 1.5s; }
        .orbit-icon-5 { top: 20px; right: 20px; animation-delay: 2s; }
        .orbit-icon-6 { bottom: 20px; right: 20px; animation-delay: 2.5s; }
        .orbit-icon-7 { bottom: 20px; left: 20px; animation-delay: 3s; }
        .orbit-icon-8 { top: 20px; left: 20px; animation-delay: 3.5s; }
        
        .glowing-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #00ffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #00ffff;
            animation: particleFloat 4s ease-in-out infinite;
        }
        
        .tech-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 10s linear infinite;
            z-index: -1;
        }
        
        .navigation-panel {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 25px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            color: #00ffff;
            font-size: 14px;
            z-index: 100;
        }
        
        @keyframes centralPulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }
        
        @keyframes rotateCentral {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @keyframes iconFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }
        
        @keyframes particleFloat {
            0% { transform: translate(0, 0) scale(0); opacity: 0; }
            20% { transform: translate(10px, -10px) scale(1); opacity: 1; }
            80% { transform: translate(-10px, 10px) scale(1); opacity: 1; }
            100% { transform: translate(0, 0) scale(0); opacity: 0; }
        }
        
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(50px, 50px); }
        }
        
        /* Navigation Icons */
        .nav-home::before { content: '🏠'; }
        .nav-dashboard::before { content: '📊'; }
        .nav-settings::before { content: '⚙️'; }
        .nav-profile::before { content: '👤'; }
        .nav-messages::before { content: '💬'; }
        .nav-files::before { content: '📁'; }
        .nav-help::before { content: '❓'; }
        .nav-logout::before { content: '🚪'; }
    </style>
</head>
<body>
    <div class="tech-grid"></div>
    
    <div class="tech-interface">
        <!-- Central Hub -->
        <div class="central-hub" onclick="navigateTo('home')">
            <div class="central-gear">
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
                <div class="gear-tooth"></div>
            </div>
        </div>
        
        <!-- Orbit Container -->
        <div class="orbit-container" id="orbitContainer">
            <!-- Orbit Ring 1 -->
            <div class="orbit-ring orbit-ring-1" id="ring1">
                <div class="orbit-icon orbit-icon-1 nav-dashboard" onclick="navigateTo('dashboard')">
                    <div class="icon-symbol">📊</div>
                    <div class="icon-label">DASHBOARD</div>
                </div>
                <div class="orbit-icon orbit-icon-2 nav-settings" onclick="navigateTo('settings')">
                    <div class="icon-symbol">⚙️</div>
                    <div class="icon-label">SETTINGS</div>
                </div>
                <div class="orbit-icon orbit-icon-3 nav-profile" onclick="navigateTo('profile')">
                    <div class="icon-symbol">👤</div>
                    <div class="icon-label">PROFILE</div>
                </div>
                <div class="orbit-icon orbit-icon-4 nav-messages" onclick="navigateTo('messages')">
                    <div class="icon-symbol">💬</div>
                    <div class="icon-label">MESSAGES</div>
                </div>
            </div>
            
            <!-- Orbit Ring 2 -->
            <div class="orbit-ring orbit-ring-2" id="ring2">
                <div class="orbit-icon orbit-icon-5 nav-files" onclick="navigateTo('files')">
                    <div class="icon-symbol">📁</div>
                    <div class="icon-label">FILES</div>
                </div>
                <div class="orbit-icon orbit-icon-6 nav-help" onclick="navigateTo('help')">
                    <div class="icon-symbol">❓</div>
                    <div class="icon-label">HELP</div>
                </div>
                <div class="orbit-icon orbit-icon-7 nav-logout" onclick="navigateTo('logout')">
                    <div class="icon-symbol">🚪</div>
                    <div class="icon-label">LOGOUT</div>
                </div>
                <div class="orbit-icon orbit-icon-8 nav-home" onclick="navigateTo('home')">
                    <div class="icon-symbol">🏠</div>
                    <div class="icon-label">HOME</div>
                </div>
            </div>
        </div>
        
        <!-- Glowing Particles -->
        <div class="glowing-particle" style="top: 20%; left: 30%; animation-delay: 0s;"></div>
        <div class="glowing-particle" style="top: 70%; right: 25%; animation-delay: 1s;"></div>
        <div class="glowing-particle" style="bottom: 20%; left: 60%; animation-delay: 2s;"></div>
        <div class="glowing-particle" style="top: 40%; right: 40%; animation-delay: 3s;"></div>
    </div>
    
    <div class="navigation-panel" id="navPanel">
        Click and drag the rings to rotate • Current: <span id="currentSection">Home</span>
    </div>
    
    <script>
        const orbitContainer = document.getElementById('orbitContainer');
        const ring1 = document.getElementById('ring1');
        const ring2 = document.getElementById('ring2');
        const navPanel = document.getElementById('navPanel');
        const currentSection = document.getElementById('currentSection');
        
        let isDragging = false;
        let ring1Rotation = 0;
        let ring2Rotation = 0;
        let lastMouseX = 0;
        let lastMouseY = 0;
        let activeSection = 'home';
        
        // Mouse/Touch interaction for orbit container only
        orbitContainer.addEventListener('mousedown', startDrag);
        orbitContainer.addEventListener('touchstart', startDrag);
        
        function startDrag(e) {
            isDragging = true;
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            lastMouseX = clientX;
            lastMouseY = clientY;
            
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchmove', drag);
            document.addEventListener('touchend', stopDrag);
            
            e.preventDefault();
        }
        
        function drag(e) {
            if (!isDragging) return;
            
            const clientX = e.clientX || e.touches[0].clientX;
            const clientY = e.clientY || e.touches[0].clientY;
            
            const deltaX = clientX - lastMouseX;
            
            // Rotate rings in opposite directions
            ring1Rotation += deltaX * 0.5;
            ring2Rotation -= deltaX * 0.3;
            
            ring1.style.transform = `translate(-50%, -50%) rotate(${ring1Rotation}deg)`;
            ring2.style.transform = `translate(-50%, -50%) rotate(${ring2Rotation}deg)`;
            
            lastMouseX = clientX;
            lastMouseY = clientY;
            
            e.preventDefault();
        }
        
        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('touchend', stopDrag);
        }
        
        // Navigation function
        function navigateTo(section) {
            // Remove active class from all icons
            document.querySelectorAll('.orbit-icon').forEach(icon => {
                icon.classList.remove('active');
            });
            
            // Add active class to clicked icon
            event.target.closest('.orbit-icon').classList.add('active');
            
            activeSection = section;
            currentSection.textContent = section.charAt(0).toUpperCase() + section.slice(1);
            
            // Simulate navigation
            console.log(`Navigating to: ${section}`);
            
            // You can add actual navigation logic here
            // For example: window.location.href = `/${section}`;
            // Or: loadContent(section);
        }
        
        // Auto-rotation (slower and more subtle)
        function autoRotate() {
            if (!isDragging) {
                ring1Rotation += 0.1;
                ring2Rotation -= 0.07;
                
                ring1.style.transform = `translate(-50%, -50%) rotate(${ring1Rotation}deg)`;
                ring2.style.transform = `translate(-50%, -50%) rotate(${ring2Rotation}deg)`;
            }
            requestAnimationFrame(autoRotate);
        }
        
        autoRotate();
        
        // Add dynamic particles
        function createParticle() {
            const particle = document.createElement('div');
            particle.className = 'glowing-particle';
            particle.style.position = 'absolute';
            particle.style.left = Math.random() * 500 + 'px';
            particle.style.top = Math.random() * 500 + 'px';
            particle.style.animationDelay = Math.random() * 4 + 's';
            documsent.querySelector('.tech-interface').appendChild(particle);
            
            setTimeout(() => {
                particle.remove();
            }, 4000);
        }
        
        setInterval(createParticle, 1500);
        
        // Set initial active state
        document.querySelector('.nav-home').classList.add('active');
    </script>
</body>
</html>
