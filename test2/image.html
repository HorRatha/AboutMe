<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circular Gallery with Pixel Transition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ogl/0.0.82/ogl.umd.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
      <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Figtree', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            overflow: hidden;
        }
        
        .gallery-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        
        .pixel-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        
        .pixel {
            position: absolute;
            background-color: #ff6b6b;
            opacity: 0;
            transform: scale(0);
        }
        
        .media-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }
        
        .media-item:hover {
            border-color: rgba(255, 255, 255, 0.8);
            transform: scale(1.02);
        }
        
        .media-title {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-weight: bold;
            font-size: 18px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            white-space: nowrap;
            pointer-events: none;
        }
        
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        .instructions {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 14px;
            opacity: 0.7;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="gallery-container">
        <div class="instructions">
            <p>🖱️ Mouse: Hover for pixel transition</p>
            <p>⚡ Scroll or drag to navigate</p>
        </div>
        <div id="gallery"></div>
    </div>

    <script>
        const { Camera, Mesh, Plane, Program, Renderer, Texture, Transform } = OGL;

        function debounce(func, wait) {
            let timeout;
            return function (...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }

        function lerp(p1, p2, t) {
            return p1 + (p2 - p1) * t;
        }

        function autoBind(instance) {
            const proto = Object.getPrototypeOf(instance);
            Object.getOwnPropertyNames(proto).forEach((key) => {
                if (key !== "constructor" && typeof instance[key] === "function") {
                    instance[key] = instance[key].bind(instance);
                }
            });
        }

        function createTextTexture(gl, text, font = "bold 30px Figtree", color = "white") {
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");
            context.font = font;
            const metrics = context.measureText(text);
            const textWidth = Math.ceil(metrics.width);
            const textHeight = Math.ceil(parseInt(font, 10) * 1.2);
            canvas.width = textWidth + 20;
            canvas.height = textHeight + 20;
            context.font = font;
            context.fillStyle = color;
            context.textBaseline = "middle";
            context.textAlign = "center";
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.fillText(text, canvas.width / 2, canvas.height / 2);
            const texture = new Texture(gl, { generateMipmaps: false });
            texture.image = canvas;
            return { texture, width: canvas.width, height: canvas.height };
        }

        class PixelTransition {
            constructor(element, options = {}) {
                this.element = element;
                this.gridSize = options.gridSize || 8;
                this.pixelColor = options.pixelColor || '#ff6b6b';
                this.animationDuration = options.animationDuration || 0.4;
                this.isActive = false;
                this.pixels = [];
                this.createPixelGrid();
                this.bindEvents();
            }

            createPixelGrid() {
                this.pixelContainer = document.createElement('div');
                this.pixelContainer.className = 'pixel-overlay';
                this.element.appendChild(this.pixelContainer);

                for (let row = 0; row < this.gridSize; row++) {
                    for (let col = 0; col < this.gridSize; col++) {
                        const pixel = document.createElement('div');
                        pixel.className = 'pixel';
                        pixel.style.backgroundColor = this.pixelColor;
                        
                        const size = 100 / this.gridSize;
                        pixel.style.width = `${size}%`;
                        pixel.style.height = `${size}%`;
                        pixel.style.left = `${col * size}%`;
                        pixel.style.top = `${row * size}%`;
                        
                        this.pixelContainer.appendChild(pixel);
                        this.pixels.push(pixel);
                    }
                }
            }

            animatePixels(activate) {
                if (this.isActive === activate) return;
                this.isActive = activate;

                gsap.killTweensOf(this.pixels);
                
                if (activate) {
                    // Animate pixels in
                    gsap.set(this.pixels, { opacity: 0, scale: 0 });
                    gsap.to(this.pixels, {
                        opacity: 0.8,
                        scale: 1,
                        duration: this.animationDuration,
                        stagger: {
                            each: 0.02,
                            from: 'random'
                        },
                        ease: 'back.out(1.7)'
                    });
                } else {
                    // Animate pixels out
                    gsap.to(this.pixels, {
                        opacity: 0,
                        scale: 0,
                        duration: this.animationDuration,
                        stagger: {
                            each: 0.02,
                            from: 'random'
                        },
                        ease: 'back.in(1.7)'
                    });
                }
            }

            bindEvents() {
                this.element.addEventListener('mouseenter', () => {
                    this.animatePixels(true);
                });
                
                this.element.addEventListener('mouseleave', () => {
                    this.animatePixels(false);
                });
            }
        }

        class Title {
            constructor({ gl, plane, renderer, text, textColor = "white", font = "bold 20px Figtree" }) {
                autoBind(this);
                this.gl = gl;
                this.plane = plane;
                this.renderer = renderer;
                this.text = text;
                this.textColor = textColor;
                this.font = font;
                this.createMesh();
            }

            createMesh() {
                const { texture, width, height } = createTextTexture(this.gl, this.text, this.font, this.textColor);
                const geometry = new Plane(this.gl);
                const program = new Program(this.gl, {
                    vertex: `
                        attribute vec3 position;
                        attribute vec2 uv;
                        uniform mat4 modelViewMatrix;
                        uniform mat4 projectionMatrix;
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                        }
                    `,
                    fragment: `
                        precision highp float;
                        uniform sampler2D tMap;
                        varying vec2 vUv;
                        void main() {
                            vec4 color = texture2D(tMap, vUv);
                            if (color.a < 0.1) discard;
                            gl_FragColor = color;
                        }
                    `,
                    uniforms: { tMap: { value: texture } },
                    transparent: true,
                });
                this.mesh = new Mesh(this.gl, { geometry, program });
                const aspect = width / height;
                const textHeight = this.plane.scale.y * 0.12;
                const textWidth = textHeight * aspect;
                this.mesh.scale.set(textWidth, textHeight, 1);
                this.mesh.position.y = -this.plane.scale.y * 0.5 - textHeight * 0.5 - 0.08;
                this.mesh.setParent(this.plane);
            }
        }

        class Media {
            constructor({
                geometry,
                gl,
                image,
                index,
                length,
                renderer,
                scene,
                screen,
                text,
                viewport,
                bend,
                textColor,
                borderRadius = 0.05,
                font,
            }) {
                this.extra = 0;
                this.geometry = geometry;
                this.gl = gl;
                this.image = image;
                this.index = index;
                this.length = length;
                this.renderer = renderer;
                this.scene = scene;
                this.screen = screen;
                this.text = text;
                this.viewport = viewport;
                this.bend = bend;
                this.textColor = textColor;
                this.borderRadius = borderRadius;
                this.font = font;
                this.createShader();
                this.createMesh();
                this.createTitle();
                this.createPixelTransition();
                this.onResize();
            }

            createShader() {
                const texture = new Texture(this.gl, { generateMipmaps: false });
                this.program = new Program(this.gl, {
                    depthTest: false,
                    depthWrite: false,
                    vertex: `
                        precision highp float;
                        attribute vec3 position;
                        attribute vec2 uv;
                        uniform mat4 modelViewMatrix;
                        uniform mat4 projectionMatrix;
                        uniform float uTime;
                        uniform float uSpeed;
                        varying vec2 vUv;
                        void main() {
                            vUv = uv;
                            vec3 p = position;
                            p.z = (sin(p.x * 3.0 + uTime) * 0.8 + cos(p.y * 2.0 + uTime) * 0.8) * (0.05 + uSpeed * 0.3);
                            gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
                        }
                    `,
                    fragment: `
                        precision highp float;
                        uniform vec2 uImageSizes;
                        uniform vec2 uPlaneSizes;
                        uniform sampler2D tMap;
                        uniform float uBorderRadius;
                        varying vec2 vUv;
                        
                        float roundedBoxSDF(vec2 p, vec2 b, float r) {
                            vec2 d = abs(p) - b;
                            return length(max(d, vec2(0.0))) + min(max(d.x, d.y), 0.0) - r;
                        }
                        
                        void main() {
                            vec2 ratio = vec2(
                                min((uPlaneSizes.x / uPlaneSizes.y) / (uImageSizes.x / uImageSizes.y), 1.0),
                                min((uPlaneSizes.y / uPlaneSizes.x) / (uImageSizes.y / uImageSizes.x), 1.0)
                            );
                            vec2 uv = vec2(
                                vUv.x * ratio.x + (1.0 - ratio.x) * 0.5,
                                vUv.y * ratio.y + (1.0 - ratio.y) * 0.5
                            );
                            vec4 color = texture2D(tMap, uv);
                            
                            float d = roundedBoxSDF(vUv - 0.5, vec2(0.5 - uBorderRadius), uBorderRadius);
                            if(d > 0.0) {
                                discard;
                            }
                            
                            gl_FragColor = vec4(color.rgb, 1.0);
                        }
                    `,
                    uniforms: {
                        tMap: { value: texture },
                        uPlaneSizes: { value: [0, 0] },
                        uImageSizes: { value: [0, 0] },
                        uSpeed: { value: 0 },
                        uTime: { value: 100 * Math.random() },
                        uBorderRadius: { value: this.borderRadius },
                    },
                    transparent: true,
                });

                const img = new Image();
                img.crossOrigin = "anonymous";
                img.src = this.image;
                img.onload = () => {
                    texture.image = img;
                    this.program.uniforms.uImageSizes.value = [img.naturalWidth, img.naturalHeight];
                };
            }

            createMesh() {
                this.plane = new Mesh(this.gl, {
                    geometry: this.geometry,
                    program: this.program,
                });
                this.plane.setParent(this.scene);
            }

            createTitle() {
                this.title = new Title({
                    gl: this.gl,
                    plane: this.plane,
                    renderer: this.renderer,
                    text: this.text,
                    textColor: this.textColor,
                    font: this.font,
                });
            }

            createPixelTransition() {
                // Create a DOM element that matches the WebGL plane position
                this.domElement = document.createElement('div');
                this.domElement.className = 'media-item';
                this.domElement.style.position = 'absolute';
                this.domElement.style.pointerEvents = 'none';
                document.body.appendChild(this.domElement);

                // Initialize pixel transition
                this.pixelTransition = new PixelTransition(this.domElement, {
                    gridSize: 10,
                    pixelColor: '#ff6b6b',
                    animationDuration: 0.5
                });

                // Add mouse event listeners to the canvas
                const canvas = this.gl.canvas;
                this.mouseEnterHandler = (e) => this.onMouseEnter(e);
                this.mouseLeaveHandler = (e) => this.onMouseLeave(e);
                this.mouseMoveHandler = (e) => this.onMouseMove(e);
                
                canvas.addEventListener('mouseenter', this.mouseEnterHandler);
                canvas.addEventListener('mouseleave', this.mouseLeaveHandler);
                canvas.addEventListener('mousemove', this.mouseMoveHandler);
            }

            onMouseEnter(e) {
                this.updateDOMPosition();
            }

            onMouseLeave(e) {
                this.pixelTransition.animatePixels(false);
            }

            onMouseMove(e) {
                if (this.isMouseOverPlane(e)) {
                    this.pixelTransition.animatePixels(true);
                    this.updateDOMPosition();
                } else {
                    this.pixelTransition.animatePixels(false);
                }
            }

            isMouseOverPlane(e) {
                const rect = this.gl.canvas.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
                const y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

                const planeX = this.plane.position.x;
                const planeY = this.plane.position.y;
                const planeWidth = this.plane.scale.x;
                const planeHeight = this.plane.scale.y;

                // Convert world coordinates to screen coordinates
                const screenX = (planeX / (this.viewport.width / 2));
                const screenY = (planeY / (this.viewport.height / 2));

                const tolerance = 0.5;
                return (
                    Math.abs(x - screenX) < (planeWidth / (this.viewport.width / 2)) * tolerance &&
                    Math.abs(y - screenY) < (planeHeight / (this.viewport.height / 2)) * tolerance
                );
            }

            updateDOMPosition() {
                const rect = this.gl.canvas.getBoundingClientRect();
                const planeX = this.plane.position.x;
                const planeY = this.plane.position.y;
                const planeWidth = this.plane.scale.x;
                const planeHeight = this.plane.scale.y;

                // Convert world coordinates to screen coordinates
                const screenX = ((planeX / (this.viewport.width / 2)) * 0.5 + 0.5) * rect.width;
                const screenY = ((-planeY / (this.viewport.height / 2)) * 0.5 + 0.5) * rect.height;
                
                const screenWidth = (planeWidth / (this.viewport.width / 2)) * rect.width * 0.5;
                const screenHeight = (planeHeight / (this.viewport.height / 2)) * rect.height * 0.5;

                this.domElement.style.left = `${rect.left + screenX - screenWidth / 2}px`;
                this.domElement.style.top = `${rect.top + screenY - screenHeight / 2}px`;
                this.domElement.style.width = `${screenWidth}px`;
                this.domElement.style.height = `${screenHeight}px`;
            }

            update(scroll, direction) {
                this.plane.position.x = this.x - scroll.current - this.extra;

                const x = this.plane.position.x;
                const H = this.viewport.width / 2;

                if (this.bend === 0) {
                    this.plane.position.y = 0;
                    this.plane.rotation.z = 0;
                } else {
                    const B_abs = Math.abs(this.bend);
                    const R = (H * H + B_abs * B_abs) / (2 * B_abs);
                    const effectiveX = Math.min(Math.abs(x), H);

                    const arc = R - Math.sqrt(R * R - effectiveX * effectiveX);
                    if (this.bend > 0) {
                        this.plane.position.y = -arc;
                        this.plane.rotation.z = -Math.sign(x) * Math.asin(effectiveX / R);
                    } else {
                        this.plane.position.y = arc;
                        this.plane.rotation.z = Math.sign(x) * Math.asin(effectiveX / R);
                    }
                }

                this.speed = scroll.current - scroll.last;
                this.program.uniforms.uTime.value += 0.04;
                this.program.uniforms.uSpeed.value = this.speed;

                const planeOffset = this.plane.scale.x / 2;
                const viewportOffset = this.viewport.width / 2;
                this.isBefore = this.plane.position.x + planeOffset < -viewportOffset;
                this.isAfter = this.plane.position.x - planeOffset > viewportOffset;
                
                if (direction === "right" && this.isBefore) {
                    this.extra -= this.widthTotal;
                    this.isBefore = this.isAfter = false;
                }
                if (direction === "left" && this.isAfter) {
                    this.extra += this.widthTotal;
                    this.isBefore = this.isAfter = false;
                }

                // Update DOM element position
                this.updateDOMPosition();
            }

            onResize({ screen, viewport } = {}) {
                if (screen) this.screen = screen;
                if (viewport) {
                    this.viewport = viewport;
                    if (this.plane.program.uniforms.uViewportSizes) {
                        this.plane.program.uniforms.uViewportSizes.value = [this.viewport.width, this.viewport.height];
                    }
                }
                this.scale = this.screen.height / 1500;
                this.plane.scale.y = (this.viewport.height * (900 * this.scale)) / this.screen.height;
                this.plane.scale.x = (this.viewport.width * (700 * this.scale)) / this.screen.width;
                this.plane.program.uniforms.uPlaneSizes.value = [this.plane.scale.x, this.plane.scale.y];
                this.padding = 2;
                this.width = this.plane.scale.x + this.padding;
                this.widthTotal = this.width * this.length;
                this.x = this.width * this.index;
            }
        }

        class App {
            constructor(
                container,
                {
                    items,
                    bend = 3,
                    textColor = "#ffffff",
                    borderRadius = 0.05,
                    font = "bold 24px Figtree",
                    scrollSpeed = 2,
                    scrollEase = 0.05,
                } = {}
            ) {
                this.container = container;
                this.scrollSpeed = scrollSpeed;
                this.scroll = { ease: scrollEase, current: 0, target: 0, last: 0 };
                this.onCheckDebounce = debounce(this.onCheck, 200);
                this.createRenderer();
                this.createCamera();
                this.createScene();
                this.onResize();
                this.createGeometry();
                this.createMedias(items, bend, textColor, borderRadius, font);
                this.update();
                this.addEventListeners();
            }

            createRenderer() {
                this.renderer = new Renderer({ alpha: true });
                this.gl = this.renderer.gl;
                this.gl.clearColor(0, 0, 0, 0);
                this.container.appendChild(this.gl.canvas);
            }

            createCamera() {
                this.camera = new Camera(this.gl);
                this.camera.fov = 45;
                this.camera.position.z = 20;
            }

            createScene() {
                this.scene = new Transform();
            }

            createGeometry() {
                this.planeGeometry = new Plane(this.gl, {
                    heightSegments: 50,
                    widthSegments: 100,
                });
            }

            createMedias(items, bend = 3, textColor, borderRadius, font) {
                const defaultItems = [
                    { image: `https://i.pinimg.com/736x/7f/b6/05/7fb60538564ceef755080d388a5148ea.jpg`, text: "Mountain Vista" },
                    { image: `hhttps://i.pinimg.com/736x/7f/b6/05/7fb60538564ceef755080d388a5148ea.jpg`, text: "Urban Landscape" },
                    { image: `https://i.pinimg.com/736x/7f/b6/05/7fb60538564ceef755080d388a5148ea.jpg`, text: "Ocean Waves" },
                    { image: `https://picsum.photos/seed/4/800/600`, text: "Forest Path" },
                    { image: `https://picsum.photos/seed/5/800/600`, text: "Desert Sunset" },
                    { image: `https://picsum.photos/seed/6/800/600`, text: "City Lights" },
                    { image: `https://picsum.photos/seed/7/800/600`, text: "Peaceful Lake" },
                    { image: `https://picsum.photos/seed/8/800/600`, text: "Golden Hour" },
                    { image: `https://picsum.photos/seed/9/800/600`, text: "Misty Morning" },
                    { image: `https://picsum.photos/seed/10/800/600`, text: "Starry Night" },
                ];

                const galleryItems = items && items.length ? items : defaultItems;
                this.mediasImages = galleryItems.concat(galleryItems);
                this.medias = this.mediasImages.map((data, index) => {
                    return new Media({
                        geometry: this.planeGeometry,
                        gl: this.gl,
                        image: data.image,
                        index,
                        length: this.mediasImages.length,
                        renderer: this.renderer,
                        scene: this.scene,
                        screen: this.screen,
                        text: data.text,
                        viewport: this.viewport,
                        bend,
                        textColor,
                        borderRadius,
                        font,
                    });
                });
            }

            onTouchDown(e) {
                this.isDown = true;
                this.scroll.position = this.scroll.current;
                this.start = e.touches ? e.touches[0].clientX : e.clientX;
            }

            onTouchMove(e) {
                if (!this.isDown) return;
                const x = e.touches ? e.touches[0].clientX : e.clientX;
                const distance = (this.start - x) * (this.scrollSpeed * 0.025);
                this.scroll.target = this.scroll.position + distance;
            }

            onTouchUp() {
                this.isDown = false;
                this.onCheck();
            }

            onWheel(e) {
                const delta = e.deltaY || e.wheelDelta || e.detail;
                this.scroll.target += delta > 0 ? this.scrollSpeed : -this.scrollSpeed;
                this.onCheckDebounce();
            }

            onCheck() {
                if (!this.medias || !this.medias[0]) return;
                const width = this.medias[0].width;
                const itemIndex = Math.round(Math.abs(this.scroll.target) / width);
                const item = width * itemIndex;
                this.scroll.target = this.scroll.target < 0 ? -item : item;
            }

            onResize() {
                this.screen = {
                    width: this.container.clientWidth,
                    height: this.container.clientHeight,
                };
                this.renderer.setSize(this.screen.width, this.screen.height);
                this.camera.perspective({
                    aspect: this.screen.width / this.screen.height,
                });
                const fov = (this.camera.fov * Math.PI) / 180;
                const height = 2 * Math.tan(fov / 2) * this.camera.position.z;
                const width = height * this.camera.aspect;
                this.viewport = { width, height };
                if (this.medias) {
                    this.medias.forEach((media) => media.onResize({ screen: this.screen, viewport: this.viewport }));
                }
            }

            update() {
                this.scroll.current = lerp(this.scroll.current, this.scroll.target, this.scroll.ease);
                const direction = this.scroll.current > this.scroll.last ? "right" : "left";
                if (this.medias) {
                    this.medias.forEach((media) => media.update(this.scroll, direction));
                }
                this.renderer.render({ scene: this.scene, camera: this.camera });
                this.scroll.last = this.scroll.current;
                this.raf = window.requestAnimationFrame(this.update.bind(this));
            }

            addEventListeners() {
                this.boundOnResize = this.onResize.bind(this);
                this.boundOnWheel = this.onWheel.bind(this);
                this.boundOnTouchDown = this.onTouchDown.bind(this);
                this.boundOnTouchMove = this.onTouchMove.bind(this);
                this.boundOnTouchUp = this.onTouchUp.bind(this);
                
                window.addEventListener("resize", this.boundOnResize);
                window.addEventListener("mousewheel", this.boundOnWheel);
                window.addEventListener("wheel", this.boundOnWheel);
                window.addEventListener("mousedown", this.boundOnTouchDown);
                window.addEventListener("mousemove", this.boundOnTouchMove);
                window.addEventListener("mouseup", this.boundOnTouchUp);
                window.addEventListener("touchstart", this.boundOnTouchDown);
                window.addEventListener("touchmove", this.boundOnTouchMove);
                window.addEventListener("touchend", this.boundOnTouchUp);
            }

            destroy() {
                window.cancelAnimationFrame(this.raf);
                window.removeEventListener("resize", this.boundOnResize);
                window.removeEventListener("mousewheel", this.boundOnWheel);
                window.removeEventListener("wheel", this.boundOnWheel);
                window.removeEventListener("mousedown", this.boundOnTouchDown);
                window.removeEventListener("mousemove", this.boundOnTouchMove);
                window.removeEventListener("mouseup", this.boundOnTouchUp);
                window.removeEventListener("touchstart", this.boundOnTouchDown);
                window.removeEventListener("touchmove", this.boundOnTouchMove);
                window.removeEventListener("touchend", this.boundOnTouchUp);
                
                if (this.medias) {
                    this.medias.forEach(media => {
                        if (media.domElement && media.domElement.parentNode) {
                            media.domElement.parentNode.removeChild(media.domElement);
                        }
                    });
                }
